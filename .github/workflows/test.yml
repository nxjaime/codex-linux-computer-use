name: Verify installer and MCP server
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Bash syntax
        run: bash -n install.sh setup.sh
      - name: Isolated installer and protocol tests
        run: python3 -m unittest discover -s tests -v
